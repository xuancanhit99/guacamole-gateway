name: Guacamole Gateway Release

on:
  push:
    tags:
      - "guacamole-gateway-v*"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: guacamole-gateway-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    name: Verify release contents
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Validate tag against VERSION
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: test "$GITHUB_REF_NAME" = "guacamole-gateway-v$(tr -d '\r\n' < VERSION)"
      - name: Validate Compose, licenses, and secrets
        shell: bash
        run: ./scripts/release-audit.sh
      - name: Build archive bundles
        shell: pwsh
        run: ./scripts/build-release.ps1
      - name: Verify archive checksums
        shell: bash
        run: cd dist && sha256sum -c SHA256SUMS.txt
      - name: Upload release artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: guacamole-gateway-bundles
          path: |
            dist/*.zip
            dist/*.tar.gz
            dist/SHA256SUMS.txt
          if-no-files-found: error

  publish:
    name: Publish GitHub release
    if: startsWith(github.ref, 'refs/tags/')
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download bundles
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: guacamole-gateway-bundles
          path: dist
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" dist/* --clobber
            gh release edit "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --draft=false --prerelease
          else
            gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" dist/* --prerelease --title "$GITHUB_REF_NAME" --generate-notes
          fi

