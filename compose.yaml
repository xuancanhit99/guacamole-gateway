name: remote-guacamole-gateway

x-common: &common
  restart: unless-stopped
  security_opt:
    - no-new-privileges:true
  logging:
    driver: json-file
    options:
      max-size: 10m
      max-file: "3"

services:
  postgres:
    <<: *common
    image: postgres:17.11-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-guacamole}
      POSTGRES_USER: ${POSTGRES_USER:-guacamole}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Run scripts/setup.ps1 or scripts/setup.sh first}
      GUACAMOLE_ADMIN_USERNAME: ${GUACAMOLE_ADMIN_USERNAME:-admin}
      GUACAMOLE_ADMIN_PASSWORD: ${GUACAMOLE_ADMIN_PASSWORD:?Run scripts/setup.ps1 or scripts/setup.sh first}
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d:ro
    networks:
      - backend
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
    shm_size: 256mb

  guacd:
    <<: *common
    image: guacamole/guacd:1.6.0
    environment:
      LOG_LEVEL: ${GUACD_LOG_LEVEL:-info}
    volumes:
      - ./data/drive:/drive
      - ./data/recordings:/recordings
    networks:
      - backend
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 4822"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  guacamole:
    <<: *common
    image: guacamole/guacamole:1.6.0
    environment:
      GUACD_HOSTNAME: guacd
      GUACD_PORT: "4822"
      POSTGRESQL_HOSTNAME: postgres
      POSTGRESQL_PORT: "5432"
      POSTGRESQL_DATABASE: ${POSTGRES_DB:-guacamole}
      POSTGRESQL_USERNAME: ${POSTGRES_USER:-guacamole}
      POSTGRESQL_PASSWORD: ${POSTGRES_PASSWORD:?Run scripts/setup.ps1 or scripts/setup.sh first}
      POSTGRESQL_AUTO_CREATE_ACCOUNTS: "false"
      RECORDING_SEARCH_PATH: /recordings
      REMOTE_IP_VALVE_ENABLED: "true"
      LOG_LEVEL: ${GUACAMOLE_LOG_LEVEL:-info}
    volumes:
      - ./data/recordings:/recordings:ro
    depends_on:
      postgres:
        condition: service_healthy
      guacd:
        condition: service_healthy
    networks:
      - backend
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8080/guacamole/ >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 30s

  gateway:
    <<: *common
    image: nginx:1.28.3-alpine
    ports:
      - "${GATEWAY_BIND:-127.0.0.1}:${GATEWAY_PORT:-8080}:8080"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      guacamole:
        condition: service_healthy
    networks:
      - backend
      - frontend
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:8080/healthz"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 5s

networks:
  frontend:
  backend:
    internal: true

volumes:
  postgres-data:

